<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- =========================================================
     BASIC META
    ========================================================== -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />

    <title>Africa Access Water</title>
    <meta
      name="description"
      content="Africa Access Water empowers Africa through solar-powered water."
    />
    <meta
      name="keywords"
      content="Africa Access Water, Solar Water, Zambia"
    />

    <!-- =========================================================
     FAVICON
    ========================================================== -->
    <link
      rel="icon"
      href="/img/logos/Updated/AFRICA_ACCESS_WATER_STACKED.png"
      type="image/png"
    />

    <!-- =========================================================
     FONTS
    ========================================================== -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Saira:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- =========================================================
     ICONS
    ========================================================== -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/@icon/icofont@1.0.1-alpha.1/icofont.min.css"
      rel="stylesheet"
    />

    <!-- =========================================================
     VENDOR CSS
    ========================================================== -->
    <link href="/lib/animate/animate.min.css" rel="stylesheet" />
    <link href="/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/css/style.css" rel="stylesheet" />

    <!-- =========================================================
     COOKIE CONSENT
    ========================================================== -->
    <link
      rel="stylesheet"
      id="silktide-consent-manager-css"
      href="/cookie-banner/silktide-consent-manager.css"
    />

    <!-- =========================================================
     HUBSPOT
    ========================================================== -->
    <script
      id="hs-script-loader"
      async
      defer
      src="//js-eu1.hs-scripts.com/147591086.js"
    ></script>

    <!-- =========================================================
     INLINE UI FIXES (Google Translate)
    ========================================================== -->
    <style>
      .goog-te-gadget select {
        font-size: 14px !important;
        color: #333 !important;
        background: #fff !important;
        border: 1px solid #ddd !important;
        border-radius: 6px !important;
        padding: 6px 10px !important;
      }

      .goog-te-gadget select option:first-child {
        color: #666 !important;
      }
    </style>
  </head>

  <body>
    <!-- =========================================================
     REACT ROOT
    ========================================================== -->
    <div id="root"></div>

    <!-- =========================================================
     GOOGLE TRANSLATE FLOATING BUTTON
    ========================================================== -->
    <div
      id="google-translate-fab"
      style="
        position: fixed;
        bottom: 24px;
        left: 24px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      "
    >
      <button
        onclick="toggleTranslate()"
        style="
          display: flex;
          align-items: center;
          gap: 8px;
          padding: 10px 16px;
          border-radius: 30px;
          border: none;
          background: #fff;
          color: #1a76d1;
          font-size: 14px;
          cursor: pointer;
          box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        "
      >
        🌍 <span>Translate</span>
      </button>

      <div
        id="google_translate_element"
        style="
          margin-top: 10px;
          display: none;
          background: #fff;
          border-radius: 12px;
          padding: 10px;
          box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        "
      ></div>
    </div>

    <!-- =========================================================
     VENDOR JS
    ========================================================== -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="/lib/wow/wow.min.js"></script>
    <script src="/lib/easing/easing.min.js"></script>
    <script src="/lib/waypoints/waypoints.min.js"></script>
    <script src="/lib/owlcarousel/owl.carousel.min.js"></script>
    <script src="/lib/parallax/parallax.min.js"></script>

    <!-- =========================================================
     APP SCRIPTS
    ========================================================== -->
    <script src="/js/main.js"></script>
    <script src="/js/preloader.js"></script>

    <!-- =========================================================
     GOOGLE TRANSLATE LOGIC
    ========================================================== -->
    <script>
      function toggleTranslate() {
        const el = document.getElementById("google_translate_element");
        el.style.display = el.style.display === "block" ? "none" : "block";
      }

      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          {
            pageLanguage: "en",
            includedLanguages: 'en,zh-CN,hi,es,fr,ar,bn,ru,pt,ur,id,de,ja,sw',
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
            autoDisplay: false,
          },
          "google_translate_element"
        );
      }

      const gtScript = document.createElement("script");
      gtScript.src =
        "//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit";
      document.body.appendChild(gtScript);
    </script>
  </body>
</html>
